name: Backend-Tests

on:
    pull_request:
        paths:
            - "backend/**"
            - "packages/**"
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/backend_test.yml"

permissions:
    contents: read

concurrency:
    group: backend-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    gate-release:
        if: github.base_ref == 'release' && github.head_ref != 'main'
        runs-on: ubuntu-latest
        steps:
            - name: Block non-main PRs to release
              run: |
                  echo "::error::Only the main branch can be merged into release. Got: ${{ github.head_ref }}"
                  exit 1

    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Cache uv and venv
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cache/uv
                      .venv
                  key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-uv-${{ hashFiles('uv.lock') }}

            - name: Install uv and dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv sync --dev --all-packages

            # The backend test suite resolves `static/` relative to the
            # working directory, so it must run from backend/.
            - name: Run backend tests
              working-directory: backend
              env:
                  PYTHONPATH: ${{ github.workspace }}/backend
              run: uv run --package backend pytest tests -q

            - name: Run package tests
              run: |
                  uv run --package harmonize-core pytest packages/harmonize-core/tests -q
                  uv run --package colharmonize pytest packages/colharmonize/tests -q
                  uv run --package geoharmonize pytest packages/geoharmonize/tests -q

            - name: Lint packages
              run: |
                  uv run ruff check packages/
                  uv run ruff format --check packages/
