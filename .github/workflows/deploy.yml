name: Build, Push and Deploy

on:
  push:
    branches: [release]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            backend/.venv
          key: ${{ runner.os }}-py${{ steps.py.outputs.python-version }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install and test
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pip install uv
          uv sync --dev
          uv run pytest -q

  deploy:
    runs-on: self-hosted
    needs: test-backend
    steps:
      - uses: actions/checkout@v7

      - name: Clean up old images and layers
        run: podman system prune -af

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image names
        id: img
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${OWNER}/biocosmos-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${OWNER}/biocosmos-frontend" >> $GITHUB_OUTPUT

      - name: Build backend image
        run: |
          podman build --pull=always --ignorefile .containerignore \
                       -t ${{ steps.img.outputs.backend }}:latest \
                       -t ${{ steps.img.outputs.backend }}:${{ github.sha }} \
                       -f backend/Dockerfile .

      - name: Build frontend image
        run: |
          podman build --pull=always --ignorefile .containerignore \
                       -t ${{ steps.img.outputs.frontend }}:latest \
                       -t ${{ steps.img.outputs.frontend }}:${{ github.sha }} \
                       -f Dockerfile.frontend .

      # Fail the deploy before anything is pushed or restarted if either image
      # has a fixable critical or high vulnerability. Accepted exceptions go in
      # .trivyignore with a reason and a review date.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1

      - name: Scan images
        run: |
          # Scan both images before failing, so one run reports every finding.
          status=0
          for image in ${{ steps.img.outputs.backend }} ${{ steps.img.outputs.frontend }}; do
            podman save -o "$RUNNER_TEMP/image.tar" "$image:${{ github.sha }}"
            trivy image --input "$RUNNER_TEMP/image.tar" \
                        --severity CRITICAL,HIGH --ignore-unfixed \
                        --ignorefile .trivyignore --exit-code 1 || status=1
            rm -f "$RUNNER_TEMP/image.tar"
          done
          exit $status

      - name: Push images
        run: |
          podman push ${{ steps.img.outputs.backend }}:latest
          podman push ${{ steps.img.outputs.backend }}:${{ github.sha }}
          podman push ${{ steps.img.outputs.frontend }}:latest
          podman push ${{ steps.img.outputs.frontend }}:${{ github.sha }}

      - name: Login to registry and restart services
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          systemctl --user restart biocosmos-backend.service
          systemctl --user restart biocosmos-frontend.service
