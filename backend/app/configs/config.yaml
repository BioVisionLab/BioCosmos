db:
  duck:
    file: "biocosmos.duckdb"
  lance:
    file: "biocosmos.lance"
images:
  table: "nymphalidae"
  # Limit number of images to ingest into the database, set to null for no
  # The backend checks for existing images first, so this limit only applies to new images
  limit: null
  # Maximum resolution in pixels for full-resolution images
  # Example values: 512, 800, 1024, 2048
  max_resolution: 800
  # Maximum resolution in pixels for thumbnail images
  thumbnail_resolution: 128
  # File format for processed images on disk
  # Options: "jpeg", "png", "webp"
  format: "webp"
  # Directory where processed images and thumbnails are saved
  # Full-res: {processed_dir}/{img_id}.{format}
  # Thumbnails: {processed_dir}/thumbnails/{img_id}_thumbnail.{format}
  processed_dir: "static/webp"
# Path to the directory containing image metadata CSV
# Generated by Porto's lab
image_metadata:
  # file: "data_meta-nymphalidae_whole_specimen-v250613.csv"
  file: "combined_meta_table_v2025_05_07.parquet"
  table: "image_meta"
  # Support csv or parquet
  format: "parquet"
  # Skip image metadata ingestion if set to true
  skip: true
# UMAP configuration for visualizing image embeddings
umap_data:
  file: "umap-nymphalidae-embeddings-all.csv"
  table: "umap_embeddings"
  # Skip UMAP ingestion if set to true
  skip: true
gbif:
  file: "gbif-lepi-2024-occurrence.tsv"
  table: "gbif_meta"
  # Skip GBIF ingestion if set to true
  skip: true
# Per-occurrence locality, joined out of gbif_meta at startup and keyed on
# img_id, the same shape as image_meta_taxonomy. image_meta carries no locality
# columns of its own: they live on gbif_meta, joined on uuid = occurrenceID.
#
# The build is guarded by a fingerprint in ingestion_state and never raises. A
# missing gbif_meta or a failed join leaves search and the metadata panel
# serving nulls rather than blocking startup.
locality:
  skip: false
  table: "image_meta_locality"
  # Written by `geoharmonize integrate`, never by the backend. Absent until
  # that has been run once with the backend stopped; readers degrade to null.
  coordinates_table: "image_meta_coordinates"
# Catalogue of Life taxonomy backbone, ingested from a ColDP release directory
# pointed at by COL_DIR. Replaces GBIF as the source of classification data.
col:
  file: "NameUsage.tsv"
  vernacular_file: "VernacularName.tsv"
  table: "col_taxonomy"
  vernacular_table: "col_vernacular"
  # Restrict the ingested backbone to one clade. Leave clade_value empty for all of CoL.
  clade_rank: "order"
  clade_value: "Lepidoptera"
  # Where the reusable CoL reference index is cached. It is roughly 3.6 GB and
  # takes about a minute to build, so it is worth keeping. Unset, it lands in
  # ~/.cache/colharmonize, shared with the CLI. Set it — relative paths resolve
  # under DUCK_DIR — where HOME is not persistent, such as in a container.
  # cache_dir: "col_cache"
  matches_table: "col_taxonomy_matches"
  variants_table: "col_taxon_variants"
  candidates_table: "col_taxonomy_candidates"
  occurrence_status_table: "image_meta_taxonomy"
  # Unlike the other sources, this one stays on. Those are skipped because
  # their tables are already inside biocosmos.duckdb; col_taxonomy is not, so
  # skipping it leaves the site with no taxonomy at all. The ingest is guarded
  # by a fingerprint in ingestion_state: one stat call (~0ms) when the release
  # is unchanged, ~4s when it changes, and a logged warning when COL_DIR is
  # unset or the release is missing.
  skip: false
leptrait:
  url: "https://raw.githubusercontent.com/hhandika/LepTraits/refs/heads/main/consensus/consensus.csv"
  table: "lep_traits_consensus"
  # Skip leptrait ingestion if set to true
  skip: true
embedder:
  # Skip embedding process if set to true
  skip: true
  # Options: "default", "cpu", "cuda", "mps"
  # "default" will detect the best available accelerator
  device: "default"
  # Select GPU for CUDA device, if multiple GPUs are available
  cuda_device: 0
  # Number of samples to process in each batch. Set according to your GPU memory
  batch_size: 150
  # Reset the inserted images, set to true to re-insert all images
  reset: false
openai:
  # OpenAI model to use for text summarization and other multi-modal tasks
  # Available models:
  # Llama (Meta): llama-3.1-70b-instruct, llama-3.1-8b-instruct, llama-3.1-nemotron-nano-8B-v1, llama-3.3-70b-instruct
  # Mistral / Derivatives: mistral-7b-instruct, mistral-small-3.1, mistral-small, mistral-large, mistral-large-2, codestral-22b
  # OpenAI GPT (chat / reasoning): gpt-3.5-turbo, gpt-4.1, gpt-4.1-mini, gpt-4.1-nano, gpt-4o, gpt-4o-mini, gpt-5, gpt-5-mini, gpt-5-nano
  # OpenAI Reasoning (o-series): o1, o1-mini, o3, o3-mini, o3-mini-high, o3-mini-medium, o4-mini, o4-mini-high, o4-mini-medium
  # Anthropic Claude: claude-3-haiku, claude-3-sonnet, claude-3-opus, claude-3.5-haiku, claude-3.5-sonnet, claude-3.5-sonnet-v2, claude-3.7-sonnet, claude-3.7-sonnet-thinking, claude-4-sonnet
  # Google Gemini: gemini-1.5-flash-001, gemini-1.5-flash-002, gemini-1.5-pro-001, gemini-1.5-pro-002, gemini-2.0-flash, gemini-2.5-flash-exp, gemini-2.5-pro-exp, gemini-2.5-flash, gemini-2.5-pro
  # Amazon Nova: nova-lite, nova-micro, nova-pro
  # Gemma / Granite / Gemma-like: gemma-3-27b-it, granite-3.3-8b-instruct
  # Image / Multimodal Gen: flux.1-dev, flux.1-schnell
  # Audio / Speech / TTS: whisper-large-v3, kokoro
  # Embeddings: sfr-embedding-mistral, nomic-embed-text-v1.5, text-embedding-3-large, text-embedding-3-small
  model: "mistral-small-3.1"
