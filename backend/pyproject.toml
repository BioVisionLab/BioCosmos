[project]
name = "backend"
version = "0.1.0"
description = "Backend service for image classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6.3",
    # Drives the taxonomy matching in-process, so the backend can harmonize
    # occurrence names against Catalogue of Life without a separate CLI run.
    "colharmonize",
    "duckdb>=1.3.1",
    "fastapi[standard]>=0.115.12",
    # The GADM -> ISO country lookup the analysis notebooks also use.
    "harmonize-core",
    "lancedb>=0.24.1",
    "openai>=2.0.0",
    "pillow>=11.2.1",
    "polars[pyarrow]>=1.31.0",
    # ISO 3166 alpha-2 -> country name for the locality table. Pinned to the
    # range geoharmonize uses so the workspace resolves a single copy.
    "pycountry>=24.6,<25",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.4",
    "timm>=1.0.15",
    "torch>=2.7.1",
    "tqdm>=4.67.1",
    "transformers>=4.52.4",
    "uvicorn>=0.34.3",
]

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-asyncio>=1.0.0", "ruff>=0.12.0"]
