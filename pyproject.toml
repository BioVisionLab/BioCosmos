[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "colharmonize"
version = "0.1.0"
description = "Batch taxonomic matching and coordinate validation for occurrence data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Haryo Handika" }]
dependencies = [
    "duckdb>=1.4,<2",
    "matplotlib>=3.9,<4",
    "pycountry>=24.6,<25",
    "pydantic>=2.10,<3",
    "seaborn>=0.13,<1",
    "shapely>=2.1,<3",
    "typer>=0.15,<1",
]

[project.scripts]
colharmonize = "colharmonize.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colharmonize"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["benchmark: performance-scaling fixtures"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
