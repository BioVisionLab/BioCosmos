[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morphospace"
version = "0.1.0"
description = "Dorso-ventral morphospaces, disparity and correlation from UNICOM image embeddings"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Haryo Handika" }]
dependencies = [
    "harmonize-core",
    "duckdb>=1.3.1",
    "lancedb>=0.39.0",
    "numpy>=2",
    "polars[pyarrow]>=1.31.0",
    "pyarrow>=18",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.15,<1",
]

[project.scripts]
morphospace = "morphospace.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[tool.uv.sources]
harmonize-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/morphospace"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
