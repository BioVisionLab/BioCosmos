# Labelled planner queries for plannerbench.
#
# Each case lists every tool plan that counts as correct. A plan maps a tool
# name to the arguments it must carry:
#
#   {}                                    any arguments
#   { country = "BR" }                    exact value (case-insensitive, trimmed)
#   { country = ["BR", "PE"] }            any of these values
#   { canopy = "*" }                      present, with any value
#   { state_province = "-" }              not passed (null counts as not passed)
#   { state_province = ["Amazonas", "-"] } that value, or not passed
#
# A trial is correct when the set of valid tool calls equals the plan's tools
# exactly: a missing tool and an extra tool are both wrong. An empty plan
# (`{}` in `accept`) means "call no tool".

# --- Single intent -----------------------------------------------------------

[[cases]]
id = "color-only"
query = "orange butterflies with black stripes"
note = "Visual description only."
accept = [{ search_by_color = {} }]

[[cases]]
id = "country-only"
query = "butterflies of Indonesia"
note = "Country name to ISO alpha-2."
accept = [{ search_by_location = { country = "ID", state_province = "-" } }]

[[cases]]
id = "adm1-ambiguous-name"
query = "butterflies in Georgia USA"
note = "The US state, not the country GE."
accept = [{ search_by_location = { country = "US", state_province = "Georgia" } }]

[[cases]]
id = "similar-scientific"
query = "similar to Danaus plexippus"
accept = [{ search_by_image_similarity = { reference_species = "Danaus plexippus" } }]

[[cases]]
id = "similar-common-name"
query = "monarch look-alikes"
note = "Preserve the common name for database resolution."
accept = [{ search_by_image_similarity = { reference_species = "monarch" } }]

[[cases]]
id = "similar-common-name-morpho"
query = "species that resemble the blue morpho"
accept = [
  { search_by_image_similarity = { reference_species = "blue morpho" } },
]

[[cases]]
id = "trait-only"
query = "butterflies that live in the forest canopy"
accept = [{ search_by_traits = { canopy = "closed" } }]

# --- Combinations ------------------------------------------------------------

[[cases]]
id = "color-country"
query = "blue from brazil"
accept = [{ search_by_color = {}, search_by_location = { country = "BR", state_province = "-" } }]

[[cases]]
id = "color-country-yellow"
query = "yellow butterflies from Indonesia"
accept = [{ search_by_color = {}, search_by_location = { country = "ID", state_province = "-" } }]

[[cases]]
id = "similar-country"
query = "butterflies like Morpho menelaus from Peru"
accept = [
  { search_by_image_similarity = { reference_species = "Morpho menelaus" }, search_by_location = { country = "PE", state_province = "-" } },
]

[[cases]]
id = "color-trait"
query = "spotted butterflies in disturbed habitats"
accept = [{ search_by_color = {}, search_by_traits = { disturbance = "tolerant" } }]

[[cases]]
id = "color-country-trait"
query = "orange canopy butterflies in Costa Rica"
accept = [
  { search_by_color = {}, search_by_location = { country = "CR", state_province = "-" }, search_by_traits = { canopy = "*" } },
]

# --- Descriptive queries with more than one reasonable reading ---------------

[[cases]]
id = "descriptive"
query = "owl-like butterfly"
note = "Appearance description; do not invent a taxon."
accept = [
  { search_by_color = {} },
]

[[cases]]
id = "descriptive-country"
query = "owl-like butterfly from brazil"
accept = [
  { search_by_color = {}, search_by_location = { country = "BR", state_province = "-" } },
]

[[cases]]
id = "descriptive-glasswing"
query = "glasswing butterfly"
accept = [{ search_by_common_name = { common_name = "glasswing butterfly" } }]

# --- Restraint ---------------------------------------------------------------

[[cases]]
id = "ignore-generic-terms"
query = "show me red butterfly species"
note = "Generic words must not add tools."
accept = [{ search_by_color = {} }]

[[cases]]
id = "common-name"
query = "show me monarch"
accept = [{ search_by_common_name = { common_name = "monarch" } }]

[[cases]]
id = "common-name-country"
query = "monarch in Brazil"
accept = [{ search_by_common_name = { common_name = "monarch" }, search_by_location = { country = "BR", state_province = "-" } }]
