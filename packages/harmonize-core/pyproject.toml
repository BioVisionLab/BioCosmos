[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harmonize-core"
version = "0.1.0"
description = "Shared DuckDB, configuration, and reporting primitives for the harmonize tools"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Haryo Handika" }]
dependencies = [
    "duckdb>=1.4,<2",
    "pycountry>=24.6,<25",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harmonize_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
